<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="NEWS_TITLE">News Digest Archive | HRCO</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .digest-controls {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #search-box {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--color-border);
            border-radius: var(--border-radius);
            background: var(--color-surface);
            color: var(--color-text);
            font-size: 1rem;
            transition: all var(--transition);
        }

        #search-box:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-glow);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--color-border);
            border-radius: 20px;
            background: var(--color-surface);
            color: var(--color-text-subtle);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all var(--transition);
        }

        .filter-btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .filter-btn.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #fff;
        }

        .news-item {
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            background: var(--color-surface);
            transition: all var(--transition);
        }

        .news-item:hover {
            border-color: var(--color-primary);
            transform: translateX(4px);
        }

        .news-item.hidden {
            display: none;
        }

        .news-item h3 {
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .news-item h3 a {
            color: inherit;
            text-decoration: none;
        }

        .news-item h3 a:hover {
            text-decoration: underline;
        }

        .news-meta {
            font-size: 0.85rem;
            color: var(--color-text-subtle);
            margin-bottom: 0.75rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .news-category {
            background: var(--color-highlight);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--color-text-subtle);
        }

        #results-count {
            font-size: 0.9rem;
            color: var(--color-text-subtle);
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="logo">HRCO</a>

            <nav>
                <a href="index.html" class="nav-link" data-i18n="HOME_LINK">Start</a>
                <a href="news.html" class="nav-link active" data-i18n="NEWS_LINK">News</a>
                <a href="foto.html" class="nav-link" data-i18n="FOTO_LINK">Visual Evidence</a>
                <a href="projects.html" class="nav-link" data-i18n="PROJECTS_LINK">Projects</a>
                <a href="about_me.html" class="nav-link" data-i18n="ABOUT_LINK">The Entity</a>
                <a href="my_suggestions.html" class="nav-link" data-i18n="SUGGESTIONS_LINK">Wise Voices</a>
            </nav>

            <div class="settings-bar">
                <div class="lang-toggles">
                    <button id="lang-toggle-slo" class="toggle-button">SLO</button>
                    <button id="lang-toggle-eng" class="toggle-button">ENG</button>
                </div>
            </div>
        </header>

        <main>
            <section class="card">
                <h1 data-i18n="NEWS_HEADING">Daily Digest Archive</h1>
                <p data-i18n="NEWS_INTRO">A chronological collection of digital discoveries, presented in reverse temporal order.</p>

                <div class="digest-controls">
                    <input type="search" id="search-box" placeholder="Search articles..." />
                    
                    <div class="filter-buttons" id="category-filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="tech">Tech</button>
                        <button class="filter-btn" data-filter="ai">AI</button>
                        <button class="filter-btn" data-filter="sports">Sports</button>
                        <button class="filter-btn" data-filter="gaming">Gaming</button>
                        <button class="filter-btn" data-filter="security">Security</button>
                    </div>
                    
                    <div id="results-count"></div>
                </div>
            </section>

            <div id="news-list"></div>
        </main>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="current-year"></span> | <span data-i18n="FOOTER_TEXT">Constructed by HRCO. Mostly harmless.</span></p>
        </div>
    </footer>

    <script>
        // Sample news data - replace with your actual data source
        const newsData = [
            { id: 1, title: "Claude 4 Released with Enhanced Reasoning", category: "ai", date: "2025-01-06", url: "#", summary: "Anthropic announces significant improvements to reasoning capabilities." },
            { id: 2, title: "New JavaScript Framework Promises Less JavaScript", category: "tech", date: "2025-01-05", url: "#", summary: "Developers cautiously optimistic about framework that claims to reduce complexity." },
            { id: 3, title: "Major Security Vulnerability Found in Popular Library", category: "security", date: "2025-01-05", url: "#", summary: "npm package with millions of downloads affected." },
            { id: 4, title: "Esports Tournament Breaks Viewership Records", category: "gaming", date: "2025-01-04", url: "#", summary: "League of Legends World Championship draws unprecedented audience." },
            { id: 5, title: "Local Team Achieves Improbable Victory", category: "sports", date: "2025-01-04", url: "#", summary: "Against all odds, underdogs triumph." },
            { id: 6, title: "Open Source AI Model Rivals Commercial Options", category: "ai", date: "2025-01-03", url: "#", summary: "Community-driven project shows impressive benchmarks." },
            { id: 7, title: "WebAssembly Performance Improvements Land in Browsers", category: "tech", date: "2025-01-02", url: "#", summary: "Significant speed gains for web applications." },
            { id: 8, title: "Retro Gaming Console Gets Modern Upgrade", category: "gaming", date: "2025-01-01", url: "#", summary: "Classic hardware meets contemporary features." }
        ];

        const searchBox = document.getElementById('search-box');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const newsList = document.getElementById('news-list');
        const resultsCount = document.getElementById('results-count');

        let currentFilter = 'all';
        let searchTerm = '';

        // Render news items
        function renderNews() {
            const filtered = newsData.filter(item => {
                const matchesFilter = currentFilter === 'all' || item.category === currentFilter;
                const matchesSearch = searchTerm === '' || 
                    item.title.toLowerCase().includes(searchTerm) ||
                    item.summary.toLowerCase().includes(searchTerm);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                newsList.innerHTML = '<div class="no-results card"><p>No articles found. The universe is temporarily devoid of matching content.</p></div>';
                resultsCount.textContent = '0 results';
                return;
            }

            resultsCount.textContent = `${filtered.length} article${filtered.length !== 1 ? 's' : ''} found`;

            newsList.innerHTML = filtered.map(item => `
                <article class="news-item" data-category="${item.category}">
                    <h3><a href="${item.url}" target="_blank">${item.title}</a></h3>
                    <div class="news-meta">
                        <span class="news-category">${item.category}</span>
                        <span>${item.date}</span>
                    </div>
                    <p>${item.summary}</p>
                </article>
            `).join('');
        }

        // Filter button clicks
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderNews();
            });
        });

        // Search input
        searchBox.addEventListener('input', (e) => {
            searchTerm = e.target.value.toLowerCase().trim();
            renderNews();
        });

        // Initial render
        renderNews();
    </script>

    <script src="js/main.js"></script>
</body>
</html>
